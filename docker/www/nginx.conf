# -------------- eventos mínimos --------------
events {
    worker_connections 1024;
}

http {
    # -------------- upstreams --------------
    upstream api_gateway {
        server api-gateway:3000;
    }
    upstream yavendi_app {
        server yavendi:3000;
    }

    # ——————————————————————————————————————————
    # map debe ir en http, NO dentro de server
    # ——————————————————————————————————————————
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------- bloque HTTP → HTTPS --------------
    server {
        listen 80;
        server_name devrocket.org www.devrocket.org;

        # Esta ruta debe coincidir con tu webroot de Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        # REDIRIGIR TODO LO DEMÁS A HTTPS (opcional)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------- servidor HTTPS --------------
    server {
        listen 443 ssl http2;
        server_name devrocket.org www.devrocket.org;

        # certificados Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/devrocket.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devrocket.org/privkey.pem;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 1) WebSockets de tu API
        location /socket.io/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # 2) Rutas API REST
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # 3) NextJS – assets, _next/* y ruta raíz
        location ~ ^/(?:_next/|static/|favicon.ico) {
            proxy_pass http://yavendi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # 4) Cualquier otra ruta va al frontend
        location / {
            proxy_pass http://yavendi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
