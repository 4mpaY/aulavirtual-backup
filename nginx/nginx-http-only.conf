# Configuración temporal de Nginx - SOLO HTTP (Puerto 80)
# Para obtener certificado SSL con Certbot
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimización de transferencia
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # Compresión Gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css application/javascript application/x-javascript application/json;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Upstream para el contenedor de Next.js
    upstream nextjs_upstream {
        server web:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Servidor HTTP - SOLO PUERTO 80 (SIN SSL)
    server {
        listen 80;
        server_name tudominio.com www.tudominio.com;

        # CRÍTICO: Reto de Certbot para SSL
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        # Videos protegidos con token firmado
        location /private-videos/ {
            secure_link $arg_token,$arg_expires;
            secure_link_md5 "$secure_link_expires$uri TU_SECRET_KEY";

            if ($secure_link = "") { return 403; }       # token inválido
            if ($secure_link = "0") { return 410; }      # token expirado

            alias /app/private/videos/;

            # ✅ Soporte de range requests (seek) nativo
            add_header Accept-Ranges bytes;
            add_header Cache-Control "no-cache, no-store";

            # Tipos de video
            types {
                video/mp4  mp4;
                video/webm webm;
                video/ogg  ogg;
            }
        }

        # Servir la aplicación normalmente
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Cache de archivos estáticos
        location /_next/static {
            proxy_cache_bypass $http_upgrade;
            proxy_pass http://nextjs_upstream;
            expires 365d;
            access_log off;
        }

        location /static {
            proxy_cache_bypass $http_upgrade;
            proxy_pass http://nextjs_upstream;
            expires 365d;
            access_log off;
        }
    }
}
