# Configuración optimizada de Nginx para Next.js (Standalone Mode)
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimización de transferencia
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 3G; # Permitir subida de archivos grandes (ej. videos)
    client_body_timeout 600s;
    send_timeout 600s;

    # Compresión Gzip para mejorar la velocidad
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css application/javascript application/x-javascript application/json;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Upstream para el contenedor de Next.js
    upstream nextjs_upstream {
        server web:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Servidor HTTP -> Redirigir a HTTPS
    server {
        listen 80;
        server_name tudominio.com www.tudominio.com;

        # Reto de Certbot para SSL
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Servidor HTTPS
    server {
        listen 443 ssl http2;
        server_name tudominio.com www.tudominio.com;

        # Certificados Let's Encrypt (Se asume que existen en el VPS)
        ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

        # Seguridad SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Videos protegidos con token firmado
        location /private-videos/ {
            secure_link $arg_token,$arg_expires;
            secure_link_md5 "$secure_link_expires$uri TU_SECRET_KEY";

            if ($secure_link = "") { return 403; }       # token inválido
            if ($secure_link = "0") { return 410; }      # token expirado

            alias /app/private/videos/;

            # ✅ Soporte de range requests (seek) nativo
            add_header Accept-Ranges bytes;
            add_header Cache-Control "no-cache, no-store";

            # Tipos de video
            types {
                video/mp4  mp4;
                video/webm webm;
                video/ogg  ogg;
            }
        }

        # Proxy para Next.js Standalone
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts para evitar cortes en procesos largos
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Cache de archivos estáticos para máximo rendimiento
        location /_next/static {
            proxy_cache_bypass $http_upgrade;
            proxy_pass http://nextjs_upstream;
            expires 365d;
            access_log off;
        }

        location /static {
            proxy_cache_bypass $http_upgrade;
            proxy_pass http://nextjs_upstream;
            expires 365d;
            access_log off;
        }
    }
}
