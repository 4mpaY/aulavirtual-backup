services:
  app:
    build:
      context: .
      dockerfile: dockerfile.new
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    volumes:
      - ./public:/app/public
    ports:
      - 3000:3000
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      CULQI_PUBLIC_KEY: ${CULQI_PUBLIC_KEY}
      CULQI_SECRET_KEY: ${CULQI_SECRET_KEY}
      CULQI_PRIVATE_KEY: ${CULQI_PRIVATE_KEY}
      CULQI_WEBHOOK_USER: ${CULQI_WEBHOOK_USER}
      CULQI_WEBHOOK_SECRET: ${CULQI_WEBHOOK_SECRET}
      IZIPAY_API_KEY: ${IZIPAY_API_KEY}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
    depends_on:
      - db
  nginx:
    image: nginx:1.29-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./docker.new/www/production/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/html
    environment:
      - SSL_DOMAIN_1=${SSL_DOMAIN_1}
      - SSL_DOMAIN_2=${SSL_DOMAIN_2}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./docker.new/database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - dbdata:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
volumes:
  certbot-etc:
  certbot-webroot:
  dbdata:
